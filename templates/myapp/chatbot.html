{% extends "base.html" %}
{% block content %}
<h1>Local Security Assistant</h1><p>Local knowledge and your stored findings. No LLM connected. Conversations remain in this page's memory and disappear on reload. Do not enter passwords or secrets.</p>
<div class="chat-layout"><aside><button id="newChat">New Chat</button><div id="chatList"></div></aside><section><div id="conversation" aria-live="polite"></div><p id="loading" role="status"></p><form id="chatForm">{% csrf_token %}<label for="chatInput">Security question</label><textarea id="chatInput" maxlength="1000" rows="3" required></textarea><button id="send">Send</button><button type="button" id="clearChat">Clear conversation</button></form></section></div>
<script>
(()=>{const chats=[[]];let active=0,busy=false;const el=id=>document.getElementById(id);function markdown(parent,text){let list=null;for(const line of text.split('\n')){let tag='p',body=line;if(line.startsWith('### ')){tag='h3';body=line.slice(4)}else if(line.startsWith('## ')){tag='h2';body=line.slice(3)}else if(line.startsWith('- ')){tag='li';body=line.slice(2)}if(tag==='li'){if(!list){list=document.createElement('ul');parent.append(list)}}else list=null;const node=document.createElement(tag);for(const [i,part] of body.split('**').entries()){if(i%2){const strong=document.createElement('strong');strong.textContent=part;node.append(strong)}else if(/^\/[A-Za-z0-9_/?=&%.-]*$/.test(part)&&!part.startsWith('//')){const link=document.createElement('a');link.href=part;link.textContent=part;node.append(link)}else node.append(document.createTextNode(part))}(list||parent).append(node)}}function render(){el('chatList').replaceChildren();chats.forEach((_,i)=>{const b=document.createElement('button');b.textContent='Conversation '+(i+1);b.onclick=()=>{active=i;render()};el('chatList').append(b)});el('conversation').replaceChildren();chats[active].forEach(m=>{const box=document.createElement('div');box.className='chat-message '+m.role;const label=document.createElement('strong');label.textContent=m.role==='user'?'You':'Assistant';box.append(label);const content=document.createElement('div');if(m.role==='assistant'){markdown(content,m.text)}else{content.textContent=m.text}box.append(content);if(m.role==='assistant'){const copy=document.createElement('button');copy.textContent='Copy';copy.onclick=()=>navigator.clipboard.writeText(m.text).catch(()=>{copy.textContent='Copy unavailable'});box.append(copy)}el('conversation').append(box)})}el('newChat').onclick=()=>{chats.push([]);active=chats.length-1;render()};el('clearChat').onclick=()=>{chats[active]=[];render()};el('chatInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el('chatForm').requestSubmit()}};el('chatForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const text=el('chatInput').value.trim();if(!text)return;const index=active;chats[index].push({role:'user',text});el('chatInput').value='';busy=true;el('send').disabled=true;el('loading').textContent='Consulting local knowledge…';render();try{const r=await fetch('{% url "chatbot_api" %}',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':document.querySelector('[name=csrfmiddlewaretoken]').value},body:JSON.stringify({message:text,history:chats[index].slice(-5,-1)})});const data=await r.json();chats[index].push({role:'assistant',text:data.response||data.error||'Response unavailable'})}catch(_){chats[index].push({role:'assistant',text:'Local service unavailable. Try again.'})}finally{busy=false;el('send').disabled=false;el('loading').textContent='';render()}};render()})();
</script>{% endblock %}
