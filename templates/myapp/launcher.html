{% extends "base.html" %}
{% block content %}


<section class="panel vs-card">
    <h1>Vigilant Sphere Launcher</h1>
    <p class="muted">Choose a module. Each card opens the correct page for scans, profile actions, password recovery, or logout.</p>
</section>

<section class="grid">
    {% for module in modules %}
        <a class="card vs-card" href="{{ module.url }}">
            <h2 class="text-strong">{{ module.name }}</h2>
            <p>{{ module.detail }}</p>
        </a>
    {% endfor %}
</section>
{% endblock %}
